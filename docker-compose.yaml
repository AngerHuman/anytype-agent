services:
  anytype-cli:
    image: ghcr.io/anyproto/anytype-cli:latest
    command: ["serve", "--listen-address", "0.0.0.0:31012"]
    environment:
      - ANYTYPE_API_ALLOWED_HOSTS=anytype-cli,anytype-cli:31012
    volumes:
      - ./.anytype/data:/root/.anytype
      - ./.anytype/config:/root/.config/anytype
    ports:
      - "31012:31012"

  anytype-agent:
    build:
      context: .
      target: dev
    environment:
      - ANYTYPE__API_URL=http://anytype-cli:31012
      - ANYTYPE__BOT_NAME=${ANYTYPE_BOT_NAME}
      - ANYTYPE__API_KEY=${ANYTYPE_API_KEY}

      # - LLM__NAME=agy-local
      # - LLM__MODE=cli
      # - LLM__CLI=/Users/${HOST_SSH_USER}/.local/bin/agy
      # - LLM__SSH=ssh://${HOST_SSH_USER}@host.docker.internal:22
      # - LLM__SSH_KEY=/keys/id_ed25519

      # - LLM__NAME=opencode-local
      # - LLM__MODE=cli
      # - LLM__CLI=/Users/${HOST_SSH_USER}/.bun/bin/opencode
      # - LLM__MODEL=opencode-go/glm-5.3-flash
      # - LLM__SSH=ssh://${HOST_SSH_USER}@host.docker.internal:22
      # - LLM__SSH_KEY=/keys/id_ed25519

      - LLM__NAME=opencode-api
      - LLM__MODE=api
      - LLM__API_URL=${API_URL}
      - LLM__API_KEY=${API_KEY}
      - LLM__MODEL=glm-5.3-flash
    volumes:
      - ./src:/app/src
      - ~/.ssh/id_ed25519:/keys/id_ed25519:ro
    depends_on:
      - anytype-cli
